<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - PlantCare</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <h2>🔐 Reset Password</h2>

        <p>Create a new password for your PlantCare account.</p>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash-message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form
            method="POST"
            action="{{ url_for('reset_password', token=token) }}"
        >

            <input
                type="password"
                name="password"
                placeholder="New Password"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm New Password"
                required
            >

            <button type="submit">
                Reset Password
            </button>

        </form>


        <p class="auth-bottom">

            Remember your password?

            <a href="{{ url_for('login') }}">
                Back to Login
            </a>

        </p>

    </div>

</div>

</body>
</html>
